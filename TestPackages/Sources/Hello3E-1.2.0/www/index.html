<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Hello 3E 1.2</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="card">
    <div class="logo">3E</div>
    <span class="badge">تم التنزيل والتحديث إلى 1.2.0</span>
    <h1>نجح التحديث من متجر 3E</h1>
    <p>إذا بقي رقم العداد محفوظًا، فقد نجح تنزيل الحزمة من الفهرس وتثبيتها مع الاحتفاظ بالبيانات.</p>
    <section class="counter">
      <strong id="count">0</strong>
      <span>القيمة المحفوظة من الإصدار السابق</span>
    </section>
    <button id="increase">زيادة العداد</button>
    <button id="reset" class="secondary">تصفير العداد</button>
    <p class="hint">يمكنك الآن تجربة تجاهل إصدار من المتجر، أو الرجوع إلى الإصدار السابق من تفاصيل التطبيق.</p>
  </main>
  <script src="app.js"></script>
</body>
</html>
