<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Hello 3E 1.1</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="card">
    <div class="logo">3E</div>
    <span class="badge">تم التحديث إلى 1.1.0</span>
    <h1>نجح تحديث التطبيق</h1>
    <p>إذا بقي رقم العداد كما كان قبل التحديث، فهذا يؤكد ثبات مساحة تخزين تطبيق الويب.</p>
    <section class="counter">
      <strong id="count">0</strong>
      <span>القيمة المحفوظة من الإصدار السابق</span>
    </section>
    <button id="increase">زيادة العداد</button>
    <button id="reset" class="secondary">تصفير العداد</button>
    <p class="hint">اضغط مطولًا على بطاقة التطبيق داخل 3ELocal لتجربة الرجوع إلى 1.0.0.</p>
  </main>
  <script src="app.js"></script>
</body>
</html>
